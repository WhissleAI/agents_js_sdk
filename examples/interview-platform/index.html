<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interview platform — @whissle/agents</title>
<style>
  :root {
    --ink: #16132b; --muted: #6b6785; --rule: #e4e1dc;
    --paper: #faf9f6; --card: #fff; --accent: #e5484d; --ok: #2f7d6b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eceaf7; --muted: #9691b5; --rule: #2c2752;
            --paper: #131029; --card: #1b1738; --accent: #ff6b6f; --ok: #5fbfa6; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .roles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .role {
    text-align: left; background: var(--card); color: inherit;
    border: 1px solid var(--rule); border-radius: 10px; padding: 16px; cursor: pointer;
    font: inherit;
  }
  .role:hover, .role:focus-visible { border-color: var(--accent); outline: none; }
  .role h2 { font-size: 15px; margin: 0 0 2px; }
  .role p { font-size: 13px; color: var(--muted); margin: 0; }

  .stage { display: none; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
  .stage.live { display: grid; }
  @media (max-width: 720px) { .stage.live { grid-template-columns: 1fr; } }

  .face {
    width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden;
    background: var(--card); border: 1px solid var(--rule);
    display: grid; place-items: center;
  }
  .face video { width: 100%; height: 100%; object-fit: cover; }
  .face .placeholder { color: var(--muted); font-size: 13px; text-align: center; padding: 0 16px; }

  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); }
  .dot.talk { background: var(--accent); }

  .question { font-size: 19px; font-weight: 600; line-height: 1.35; margin: 0 0 16px; min-height: 2.6em; }
  .transcript {
    border: 1px solid var(--rule); border-radius: 10px; background: var(--card);
    padding: 14px; max-height: 46vh; overflow-y: auto; font-size: 14px;
  }
  .turn { margin-bottom: 10px; }
  .who { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .interim { color: var(--muted); font-style: italic; }

  .controls { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button.act {
    font: inherit; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--card); color: inherit;
  }
  button.act.stop { color: var(--accent); border-color: var(--accent); }
  .err { color: var(--accent); font-size: 13px; margin-top: 12px; }
  .report { white-space: pre-wrap; font-size: 13px; background: var(--card);
            border: 1px solid var(--rule); border-radius: 10px; padding: 14px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Interview platform</h1>
  <p class="sub">Pick a role. The examiner is a Whissle agent, provisioned from that role's definition.</p>

  <div class="roles" id="roles"></div>

  <section class="stage" id="stage">
    <div>
      <div class="face" id="face"><span class="placeholder">The examiner's face appears here</span></div>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="state">idle</span>
      </div>
      <div class="controls">
        <button class="act" id="mute" hidden>Mute</button>
        <button class="act stop" id="end" hidden>End interview</button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <div>
      <p class="question" id="question"></p>
      <div class="transcript" id="transcript"></div>
      <div class="report" id="report" hidden></div>
    </div>
  </section>
</main>

<!-- One file, no build step. Same package you'd npm install. -->
<script type="module">
import { WhissleAgent } from "https://unpkg.com/@whissle/agents@0.4/dist/index.js";

const $ = (id) => document.getElementById(id);
let agent = null;

// ── choose a role ────────────────────────────────────────────────────────────
const roles = await (await fetch("/api/roles")).json();
$("roles").innerHTML = roles
  .map((r) => `<button class="role" data-id="${r.id}">
       <h2>${r.title}</h2><p>${r.description.slice(0, 90)}…</p></button>`)
  .join("");
for (const el of document.querySelectorAll(".role")) {
  el.onclick = () => start(el.dataset.id);
}

// ── run the interview ────────────────────────────────────────────────────────
async function start(roleId) {
  $("roles").hidden = true;
  $("stage").classList.add("live");
  setState("connecting");

  agent = new WhissleAgent({
    /**
     * The whole point. The browser holds no Whissle key: it asks OUR server,
     * which decides who this candidate is and mints a session for one agent.
     *
     * Returning the entire mint response — not just `.token` — is what lets the
     * SDK follow the transport the platform advertises and use the ICE servers
     * belonging to the box on the other end of the connection.
     */
    getToken: async () => {
      const res = await fetch("/api/interviews", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ role: roleId }),
      });
      if (!res.ok) throw new Error((await res.json()).error ?? `start failed (${res.status})`);
      const session = await res.json();
      $("question").textContent = `Interviewing for ${session.role}`;
      return session;
    },
    // A talking face, rendered in the browser straight from the provider — so
    // Whissle does no video transcoding. Drop this line for voice only.
    avatar: { id: "F1-HR", container: $("face") },
  });

  agent
    .on("connected", () => setState("connected"))
    .on("bot-ready", () => setState("listening"))
    .on("avatar-ready", () => $("face").querySelector(".placeholder")?.remove())
    // A face that won't start must never cost you the interview: the session
    // carries on, audio only.
    .on("avatar-failed", (why) => note(`Avatar unavailable — continuing with audio. ${why ?? ""}`))
    .on("speaking-started", () => setState("examiner speaking", "talk"))
    .on("speaking-stopped", () => setState("listening"))
    .on("agent-transcript", (t) => addTurn("Examiner", t))
    .on("user-transcript", (t) => { clearInterim(); addTurn("You", t); })
    // Their words as they're still being recognised. Without this, a candidate
    // talking to a silent screen assumes they aren't heard and starts over.
    .on("user-interim", (t) => showInterim(t))
    .on("mic-lost", () => note("Your microphone stopped. Check it's still connected."))
    .on("mic-restored", () => note(""))
    // Anything the SDK doesn't consume: OUR events, defined by the prompt in
    // server.mjs. This is how the agent drives your UI.
    .on("server-message", (m) => {
      if (m?.t === "question") $("question").textContent = m.text;
      if (m?.t === "complete") finish();
    })
    .on("error", (e) => note(String(e)))
    .on("disconnected", () => setState("ended"));

  try {
    await agent.start();          // asks for the microphone, then connects
    $("mute").hidden = false;
    $("end").hidden = false;
  } catch (e) {
    note(String(e?.message ?? e));
    setState("idle");
  }
}

let muted = false;
$("mute").onclick = () => {
  muted = !muted;
  agent?.setMuted(muted);
  $("mute").textContent = muted ? "Unmute" : "Mute";
};

// Asking the agent to wrap up is a message YOUR prompt taught it to understand.
$("end").onclick = () => { agent?.send("wrap-up"); finish(); };

async function finish() {
  $("end").hidden = true;
  $("mute").hidden = true;
  agent?.stop();
  setState("ended");
  $("report").hidden = false;
  $("report").textContent = "Scoring runs after the call ends — fetching…";
  // `ready:false` is a normal answer, not an error, so poll rather than give up.
  for (let i = 0; i < 10; i++) {
    await new Promise((r) => setTimeout(r, 3000));
    const calls = await (await fetch("/api/interviews")).json();
    const mine = calls[0];
    if (mine?.disposition || mine?.metadata?.session_summary) {
      $("report").textContent = JSON.stringify(mine.metadata?.session_summary ?? mine, null, 2);
      return;
    }
  }
  $("report").textContent = "Still finalising. Try: whissle calls result <id> --wait";
}

// ── small view helpers ───────────────────────────────────────────────────────
function setState(text, kind) {
  $("state").textContent = text;
  $("dot").className = "dot" + (kind === "talk" ? " talk" : text === "idle" || text === "ended" ? "" : " on");
}
function addTurn(who, text) {
  clearInterim();
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML = `<div class="who"></div><div class="text"></div>`;
  el.querySelector(".who").textContent = who;
  el.querySelector(".text").textContent = text;
  $("transcript").append(el);
  $("transcript").scrollTop = $("transcript").scrollHeight;
}
function showInterim(text) {
  let el = document.getElementById("interim");
  if (!el) {
    el = document.createElement("div");
    el.id = "interim"; el.className = "turn interim";
    $("transcript").append(el);
  }
  el.textContent = text;
  $("transcript").scrollTop = $("transcript").scrollHeight;
}
const clearInterim = () => document.getElementById("interim")?.remove();
const note = (msg) => ($("err").textContent = msg);
</script>
</body>
</html>

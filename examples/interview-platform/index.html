<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whissle example app</title>
<style>
  :root {
    --ink: #16132b; --muted: #6b6785; --rule: #e4e1dc; --paper: #faf9f6;
    --card: #fff; --accent: #e5484d; --ok: #2f7d6b; --chip: #f1efea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eceaf7; --muted: #9691b5; --rule: #2c2752; --paper: #131029;
            --card: #1b1738; --accent: #ff6b6f; --ok: #5fbfa6; --chip: #241f47; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  nav { display: flex; gap: 4px; }
  nav button {
    font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer;
  }
  nav button[aria-current="true"] { background: var(--card); border-color: var(--rule); color: var(--ink); }

  .view { display: none; } .view.on { display: block; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 15px; }
  button.card { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
  button.card:hover, button.card:focus-visible { border-color: var(--accent); outline: none; }
  .card h2 { font-size: 15px; margin: 0 0 3px; }
  .card p { font-size: 13px; color: var(--muted); margin: 0; }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip { font-size: 11px; background: var(--chip); color: var(--muted);
          padding: 2px 8px; border-radius: 999px; font-family: ui-monospace, monospace; }

  /* live call */
  .stage { display: grid; grid-template-columns: 260px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 700px) { .stage { grid-template-columns: 1fr; } }
  .face { width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden;
          background: var(--card); border: 1px solid var(--rule); display: grid; place-items: center; }
  .face video { width: 100%; height: 100%; object-fit: cover; }
  .face .ph { color: var(--muted); font-size: 12px; text-align: center; padding: 0 14px; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); } .dot.talk { background: var(--accent); }
  .question { font-size: 18px; font-weight: 600; line-height: 1.35; margin: 0 0 14px; min-height: 1.4em; }
  /* Reserves no height when hidden, so the transcript doesn't jump every tool call. */
  .thinking { display: flex; align-items: center; gap: 8px; margin: -6px 0 12px;
              font-size: 13px; color: #6b7a70; }
  .thinking::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
                      background: currentColor; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .thinking::before { animation: none; opacity: .8 } }
  .transcript { border: 1px solid var(--rule); border-radius: 10px; background: var(--card);
                padding: 13px; max-height: 44vh; overflow-y: auto; font-size: 14px; }
  .turn { margin-bottom: 9px; }
  .who { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .interim { color: var(--muted); font-style: italic; }
  .controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button.act { font: inherit; font-size: 14px; padding: 7px 15px; border-radius: 999px;
               cursor: pointer; border: 1px solid var(--rule); background: var(--card); color: inherit; }
  button.act.stop { color: var(--accent); border-color: var(--accent); }
  label.toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
                 color: var(--muted); margin-top: 12px; cursor: pointer; }
  .err { color: var(--accent); font-size: 13px; margin-top: 10px; }
  select.act { padding: 6px 10px; max-width: 100%; }

  /* The live caption. Driven by agent-word, so it keeps time with the voice rather
     than with the transcript — the transcript lands a sentence at a time. */
  .caption { min-height: 1.4em; font-size: 13px; color: var(--muted); margin: 0 0 10px;
             font-variant-numeric: tabular-nums; }
  .caption b { color: var(--ink); font-weight: 600; }
  /* Barge-in: the caller talking over the agent. */
  .caption.over { color: var(--accent); }

  /* What the agent is doing, with receipts. */
  .tools { margin: 12px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .tools li { border-left: 2px solid var(--rule); padding: 3px 0 3px 10px; margin-bottom: 6px; }
  .tools li.ok { border-color: var(--ok); } .tools li.bad { border-color: var(--accent); }
  .tools .name { font-family: ui-monospace, monospace; font-size: 12px; }
  .tools .args, .tools .prog { color: var(--muted); font-size: 12px; }
  .cites { margin: 4px 0 0; padding-left: 16px; font-size: 12px; }
  .cites a { color: inherit; }

  /* The signal ticker + the acoustic read. Both are advisory; see the notes below. */
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; min-height: 22px; }
  .sig { font-size: 11px; font-family: ui-monospace, monospace; background: var(--chip);
         color: var(--muted); padding: 2px 7px; border-radius: 999px; }
  .sig.read { background: none; border: 1px solid var(--rule); }

  /* Typing to the agent — with a call up or without one. */
  .composer { display: flex; gap: 8px; margin-top: 12px; }
  .composer input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 11px;
                    border-radius: 8px; border: 1px solid var(--rule);
                    background: var(--card); color: inherit; }
  .composer input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* sessions */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  tr.row { cursor: pointer; } tr.row:hover { background: var(--card); }
  pre { background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
        padding: 13px; overflow-x: auto; font-size: 12px; }
  .empty { color: var(--muted); font-size: 14px; padding: 24px 0; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Whissle example app</h1>
      <p class="sub">Agents from <code>agents.json</code> · voice with or without a face · past sessions</p>
    </div>
    <nav>
      <button data-view="agents" aria-current="true">Agents</button>
      <button data-view="call">Call</button>
      <button data-view="sessions">Sessions</button>
    </nav>
  </header>

  <section class="view on" id="v-agents">
    <div class="grid" id="agents"></div>
  </section>

  <section class="view" id="v-call">
    <div class="stage">
      <div>
        <div class="face" id="face"><span class="ph">Pick an agent to start</span></div>
        <div class="status"><span class="dot" id="dot"></span><span id="state">idle</span></div>
        <label class="toggle"><input type="checkbox" id="wantAvatar" checked /> Show the avatar</label>
        <label class="toggle"><input type="checkbox" id="cues" checked /> Tool sounds</label>
        <!-- Labels are only real once permission has been granted, so this fills in
             after checkMicrophone() or the first start(). -->
        <div class="controls">
          <button class="act" id="testMic">Test microphone</button>
        </div>
        <div class="controls">
          <select class="act" id="micPick" hidden aria-label="Microphone"></select>
        </div>
        <div class="controls">
          <button class="act" id="mute" hidden>Mute</button>
          <button class="act" id="wrap" hidden>Wrap up</button>
          <button class="act stop" id="end" hidden>End call</button>
        </div>
        <div class="err" id="err"></div>
        <div class="meta" id="meta"></div>
      </div>
      <div>
        <p class="question" id="question"></p>
        <p class="caption" id="caption"></p>
        <p class="thinking" id="thinking" aria-live="polite" hidden></p>
        <div class="transcript" id="transcript"></div>
        <!-- Typing works with a call up (it goes into the SAME conversation and the
             agent answers out loud) and with no call at all. -->
        <div class="composer">
          <input id="say" placeholder="Type to the agent — no microphone needed" aria-label="Message" />
          <button class="act" id="send">Send</button>
        </div>
        <ul class="tools" id="tools"></ul>
      </div>
    </div>
  </section>

  <section class="view" id="v-sessions">
    <div id="sessions"></div>
    <div id="detail"></div>
  </section>
</main>

<!--
  One file, no build step — so the browser resolves @whissle/agents itself, with an
  import map rather than a bundler.

  `/sdk/index.js` is served by server.mjs from the `dist/` next door, so running this
  example exercises THIS checkout in a real browser. (With no local build it redirects
  to the published copy on esm.sh, so a stand-alone copy of this directory still runs.)

  The map's other three entries are why a plain `<script src>` cannot work: the SDK
  imports its dependency by bare name ("@pipecat-ai/client-js"), which a bundler
  resolves and a browser does not — fetched raw it throws "Failed to resolve module
  specifier" before a line of it runs. The two dynamic imports are the optional
  renderers, fetched only if you ask for an avatar or LiveKit.

  In an app with a build step, none of this exists: `npm i @whissle/agents` and import
  it by name.
-->
<script type="importmap">
{
  "imports": {
    "@whissle/agents": "/sdk/index.js",
    "@pipecat-ai/client-js": "https://esm.sh/@pipecat-ai/client-js@1.9.1",
    "livekit-client": "https://esm.sh/livekit-client@2.21.0",
    "simli-client/dist/client.js": "https://esm.sh/simli-client@3.0.2"
  }
}
</script>
<script type="module">
import { WhissleAgent } from "@whissle/agents";

const $ = (id) => document.getElementById(id);
const api = (p, o) => fetch(p, o).then(async (r) => {
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.error ?? `${p} → ${r.status}`);
  return b;
});

let agent = null, agents = [], currentAgentId = null;

// ── navigation ───────────────────────────────────────────────────────────────
for (const b of document.querySelectorAll("nav button")) {
  b.onclick = () => show(b.dataset.view);
}
function show(view) {
  for (const b of document.querySelectorAll("nav button"))
    b.setAttribute("aria-current", String(b.dataset.view === view));
  for (const s of document.querySelectorAll(".view")) s.classList.toggle("on", s.id === `v-${view}`);
  if (view === "sessions") loadSessions();
}

// ── agents ───────────────────────────────────────────────────────────────────
// Top-level await, so an unhandled throw here would stop the rest of this module
// from ever running — leaving a blank page wired to nothing, with no clue why.
let loadError = null;
try {
  agents = await api("/api/agents");
} catch (e) {
  loadError = e;
}

$("agents").innerHTML = agents.map((a) => `
  <button class="card" data-id="${a.id}">
    <h2>${a.name}</h2>
    <p>${a.summary ?? ""}</p>
    <div class="chips">
      <span class="chip">${a.type}</span>
      ${a.avatar ? `<span class="chip">avatar ${a.avatar}</span>` : `<span class="chip">voice only</span>`}
      ${a.questions.length ? `<span class="chip">${a.questions.length} questions</span>` : ""}
    </div>
  </button>`).join("");
for (const el of document.querySelectorAll("#agents .card")) el.onclick = () => start(el.dataset.id);

if (!agents.length) {
  $("agents").append(empty(loadError
    ? `Could not reach the server — ${loadError.message ?? loadError}`
    : "No agents provisioned. Check the server log."));
}

// ── a live call ──────────────────────────────────────────────────────────────
async function start(id) {
  const def = agents.find((a) => a.id === id);
  show("call");
  reset();
  currentAgentId = id;
  setState("connecting");

  // The avatar is browser-rendered, so whether you get a face is a decision the
  // page makes per call. The same agent, the same session — one line different.
  const withAvatar = $("wantAvatar").checked && def.avatar;
  $("face").innerHTML = withAvatar
    ? `<span class="ph">Bringing up the face…</span>`
    : `<span class="ph">Voice only</span>`;

  agent = new WhissleAgent({
    /**
     * The whole point. The browser holds no Whissle key: it asks OUR server,
     * which decides who this user is and mints a session for one agent.
     *
     * Returning the entire mint response — not just `.token` — is what lets the
     * SDK follow the transport the platform advertises and use the ICE servers
     * belonging to the box on the other end of the connection.
     */
    getToken: () => api("/api/sessions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ agent: id }),
    }),
    ...(withAvatar ? { avatar: { id: def.avatar, container: $("face") } } : {}),
  });

  // A returning candidate carries on where they left off. `textThread` is a KEY, not
  // a conversation id — persist it and hand it back, and the agent still remembers.
  const saved = localStorage.getItem(`whissle:thread:${id}`);
  if (saved) agent.resumeTextThread(saved);

  agent
    .on("connected", () => setState("connected"))
    .on("bot-ready", () => { setState("listening"); void fillMicPicker(); })
    .on("avatar-ready", () => $("face").querySelector(".ph")?.remove())
    // A face that won't start must never cost you the call: it carries on, audio only.
    .on("avatar-failed", (why) => { $("face").innerHTML = `<span class="ph">Audio only</span>`;
                                    note(`Avatar unavailable — continuing with audio. ${why ?? ""}`); })
    .on("speaking-started", () => setState("agent speaking", "talk"))
    .on("speaking-stopped", () => { setState("listening"); caption(""); })
    .on("agent-transcript", (t) => { addTurn("Agent", t); caption(""); })
    .on("user-transcript", (t) => addTurn("You", t))
    // Their words while still being recognised. Without this, someone talking to
    // a silent screen assumes they aren't heard and starts the sentence over.
    .on("user-interim", (t) => showInterim(t))

    // ── the reply, at two granularities ──────────────────────────────────────
    // `agent-transcript` only fires when the agent STOPS speaking, so on a long
    // answer a transcript built from it alone sits empty and then dumps a paragraph.
    .on("agent-partial", (t) => showPending(t))
    // One word, at the moment the voice says it — the only granularity fine enough
    // for a caption that keeps time with the audio.
    .on("agent-word", (w) => caption(w, true))
    // The agent's own one-line summary of what it is saying, when it emits one.
    .on("gist", (g) => { $("caption").innerHTML = ""; caption(g); })

    // ── the VAD edges, which is where barge-in becomes visible ───────────────
    // A `listening-started` BETWEEN speaking-started and speaking-stopped means the
    // candidate talked over the interviewer. Worth showing in a mock interview:
    // interrupting is a thing being assessed, not a glitch.
    .on("listening-started", () => {
      if (agentSpeaking()) $("caption").classList.add("over");
    })
    .on("listening-stopped", () => $("caption").classList.remove("over"))

    .on("mic-lost", () => note("Your microphone stopped. Check it's still connected."))
    .on("mic-restored", () => note(""))

    // ── why it went quiet, and what it found ─────────────────────────────────
    // An interviewer that goes quiet to look something up is the single most
    // alarming thing in a mock interview — the candidate assumes they broke it.
    // The SDK plays the cue; this is the half you can read. `thinking` is already
    // one edge each way however many tools ran, so there is nothing to debounce.
    .on("thinking", (s) => {
      $("thinking").hidden = !s.active;
      $("thinking").textContent = s.label ?? "Checking something…";
    })
    // Correlate by `id` (the tool_call_id), never by name: two calls to the same
    // tool can be in flight at once.
    .on("tool-started", (t) => toolRow(t.id, t.name, t.arguments))
    .on("tool-progress", (t) => toolProgress(t.id, t.display))
    // `ok` is `undefined` — not false — when a tool timed out and whether it worked
    // is genuinely unknown. `evidence` is the receipt: what it answered FROM.
    .on("tool-finished", (t) => toolDone(t.id, t.ok, t.evidence))

    // ── advisory reads ───────────────────────────────────────────────────────
    // The live acoustic read of the candidate. `emotion` is deliberately undefined
    // whenever the platform said NEUTRAL, because the platform writes NEUTRAL both
    // for a genuinely calm speaker and as the fallback when nothing was read at all
    // — so rendering it would turn "we don't know" into "they are calm". Shown as a
    // leaning with its own probability, never as a fact, and never as a score.
    .on("user-metadata", (m) => {
      if (m.emotion) chip(`sounds ${m.emotion.label.toLowerCase()}` +
        (m.emotion.confidence ? ` · ${Math.round(m.emotion.confidence * 100)}%` : ""), "read");
      if (m.intent) chip(`intent ${m.intent.label.toLowerCase()}`, "read");
    })
    // The pipeline's live prediction stream — barge-in, endpointing, language
    // switches, flow state. Additive and versioned; a build that has never heard of
    // an event type still gets it, which is why this renders the type rather than
    // switching on a fixed list.
    .on("signal", (s) => chip(`${s.type}${s.outcome ? ` → ${s.outcome}` : ""}`))

    // This session hit the anonymous demo cap and is about to end — worth saying
    // out loud, because otherwise the call simply stops.
    .on("demo-limit", () => note("Demo limit reached — this session is ending."))

    // Anything the SDK doesn't consume: OUR events, defined by the prompt in
    // server.mjs. This is how an agent drives your interface.
    .on("server-message", (m) => {
      if (m?.t === "question") $("question").textContent = m.text;
      if (m?.t === "complete") stop();
    })
    // The sentence AND a code. "402" tells a candidate nothing; "this interview
    // can't run right now" plus a distinct code for you is the difference between
    // a bug report you can act on and "it didn't work".
    .on("error", (e, detail) => note(String(e), detail?.code))
    .on("disconnected", () => setState("ended"));

  agent.setEarconsMuted(!$("cues").checked);

  try {
    await agent.start();               // asks for the microphone, then connects
    $("mute").hidden = false; $("wrap").hidden = false; $("end").hidden = false;
    $("question").textContent = def.name;
  } catch (e) {
    // A refused microphone is not the end of the conversation: the composer below
    // still reaches the same agent over HTTP. That is the whole point of text.
    note(String(e?.message ?? e));
    setState("idle");
    $("say").focus();
  }
}

// ── typing to the agent ──────────────────────────────────────────────────────
//
// One method, two behaviours, and the difference is deliberate. With a call up the
// text is injected into the SAME conversation and answered OUT LOUD (it resolves
// null — the reply arrives as speech, through agent-transcript). With no call it
// runs a text turn over HTTP and resolves with the reply, the tools it used and the
// citations behind them. Neither needs a microphone.
async function sendTyped() {
  const text = $("say").value.trim();
  if (!text || !agent) return;
  $("say").value = "";
  addTurn("You", text);
  $("send").disabled = true;
  try {
    const turn = await agent.sendText(text);
    if (turn) {
      // The HTTP path. `agent-transcript` already rendered the reply, so what is
      // left is the receipt.
      for (const name of turn.toolsUsed) toolDone(`text:${name}`, true, [], name);
      if (turn.evidence?.length) toolDone(`text:evidence`, true, turn.evidence, "sources");
      // Persist the KEY that resumes this thread — not `turn.conversationId`, which
      // is the gateway's row id and resumes nothing.
      if (turn.threadId) localStorage.setItem(`whissle:thread:${currentAgentId}`, turn.threadId);
    }
  } catch (e) {
    // `sendText` already emitted a described `error`; give them their words back.
    $("say").value = text;
  } finally {
    $("send").disabled = false;
    $("say").focus();
  }
}
$("send").onclick = () => void sendTyped();
$("say").onkeydown = (e) => { if (e.key === "Enter") void sendTyped(); };

// ── microphone ───────────────────────────────────────────────────────────────
//
// Ask BEFORE showing someone a Start button that needs it. `checkMicrophone`
// returns null when it is fine, and otherwise a problem whose message names the fix
// rather than the fault ("click the padlock, choose Allow, then reload").
$("testMic").onclick = async () => {
  const probe = agent ?? new WhissleAgent({ getToken: () => ({ token: "" }) });
  const problem = await probe.checkMicrophone();
  note(problem ? problem.message : "Microphone looks fine.", problem?.code);
  await fillMicPicker();
};

/** Labels are placeholders until permission is granted, so this is only worth
 *  drawing after a check or a live session. */
async function fillMicPicker() {
  if (!agent) return;
  const mics = await agent.listMicrophones();
  if (!mics.length || !mics[0].label) return;
  $("micPick").hidden = false;
  $("micPick").innerHTML = mics
    .map((m) => `<option value="${m.deviceId}">${m.label}</option>`).join("");
}
// Swaps the device the transport already owns rather than opening a second one —
// holding two tracks on one input is how a device ends up locked and a session deaf.
$("micPick").onchange = () => {
  if (!agent?.setMicrophone($("micPick").value)) {
    note("This transport can't switch microphones mid-call — end the call and pick first.");
  }
};

// The cue that says the agent went to look something up. Wire it to the same
// control as mute: someone who mutes the agent means the sounds too.
$("cues").onchange = () => agent?.setEarconsMuted(!$("cues").checked);

let muted = false;
$("mute").onclick = () => {
  muted = !muted; agent?.setMuted(muted);
  $("mute").textContent = muted ? "Unmute" : "Mute";
};
// Two different things, and the difference is the point of `send()`.
//
// "Wrap up" asks the agent to finish: it says its closing line and then sends the
// {"t":"complete"} its prompt taught it to send, which is what ends the call. The
// message is only worth sending if you then let the agent act on it — sending it
// and hanging up in the same breath is the same as hanging up.
$("wrap").onclick = () => { agent?.send("wrap-up"); $("wrap").hidden = true; };
// "End call" is the hang-up: no closing line, no grading prompt, gone.
$("end").onclick = () => stop();

function stop() {
  // `stop()` ends the CALL and keeps the instance: its handlers survive, so the same
  // agent can be started again — and `sendText` still reaches it over HTTP, which is
  // how a candidate can keep asking questions after the interview has ended.
  agent?.stop();
  $("mute").hidden = true; $("wrap").hidden = true; $("end").hidden = true;
  setState("ended");
}
function reset() {
  // `destroy()` is the one that lets go for good — it stops the session AND drops
  // the handlers, so a page that opens many calls doesn't accumulate them.
  agent?.destroy();
  agent = null;
  $("transcript").innerHTML = ""; $("question").textContent = ""; note("");
  $("tools").innerHTML = ""; $("meta").innerHTML = ""; caption("");
  $("thinking").hidden = true;
  muted = false; $("mute").textContent = "Mute";
}

// ── sessions ─────────────────────────────────────────────────────────────────
async function loadSessions() {
  $("detail").innerHTML = "";
  $("sessions").innerHTML = `<p class="empty">Loading…</p>`;
  const rows = await api("/api/sessions").catch((e) => { note(String(e)); return []; });
  if (!rows.length) {
    $("sessions").innerHTML = `<p class="empty">No sessions yet — have a call and come back.</p>`;
    return;
  }
  $("sessions").innerHTML = `<table>
    <thead><tr><th>When</th><th>Agent</th><th>Status</th><th>Length</th></tr></thead>
    <tbody>${rows.map((c) => `<tr class="row" data-id="${c.id}">
      <td>${new Date(c.created_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</td>
      <td>${c.agentName ?? "—"}</td>
      <td>${c.status ?? "—"}</td>
      <td>${c.duration_sec != null ? c.duration_sec + "s" : "—"}</td>
    </tr>`).join("")}</tbody></table>`;
  for (const tr of document.querySelectorAll("#sessions tr.row")) tr.onclick = () => openSession(tr.dataset.id);
}

async function openSession(id) {
  $("detail").innerHTML = `<p class="empty">Loading session…</p>`;
  const { call, result } = await api(`/api/sessions/${id}`);
  // Everything below is built as DOM rather than interpolated into innerHTML.
  // A transcript is whatever a caller said, and a score is whatever a model
  // wrote — neither is yours, so neither is ever markup.
  $("detail").innerHTML = "";
  $("detail").append(heading("Transcript"));

  const box = document.createElement("div");
  box.className = "transcript";
  const turns = call.transcript ?? [];
  if (!turns.length) box.append(empty("No transcript recorded."));
  for (const t of turns) {
    const el = document.createElement("div");
    el.className = "turn";
    el.innerHTML = `<div class="who"></div><div class="t"></div>`;
    el.querySelector(".who").textContent = t.role === "assistant" ? "Agent" : "You";
    el.querySelector(".t").textContent =
      typeof t.content === "string" ? t.content : JSON.stringify(t.content);
    box.append(el);
  }
  $("detail").append(box, heading("Score"));

  // `ready: false` is a normal answer, not an error — scoring runs after the call.
  if (!result) $("detail").append(empty("No result available."));
  else if (!result.ready) $("detail").append(empty("Still scoring — this finishes shortly after the call ends."));
  else {
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(result.result ?? result, null, 2);
    $("detail").append(pre);
  }
}

// ── small view helpers ───────────────────────────────────────────────────────
function heading(text) {
  const h = document.createElement("h2");
  h.style.cssText = "font-size:15px;margin:22px 0 8px";
  h.textContent = text;
  return h;
}
function empty(text) {
  const p = document.createElement("p");
  p.className = "empty";
  p.textContent = text;
  return p;
}
function setState(text, kind) {
  $("state").textContent = text;
  $("dot").className = "dot" + (kind === "talk" ? " talk"
    : ["idle", "ended"].includes(text) ? "" : " on");
}
function addTurn(who, text) {
  clearInterim();
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML = `<div class="who"></div><div class="t"></div>`;
  el.querySelector(".who").textContent = who;
  el.querySelector(".t").textContent = text;      // textContent: never inject a transcript as HTML
  $("transcript").append(el);
  $("transcript").scrollTop = $("transcript").scrollHeight;
}
function showInterim(text) {
  let el = $("interim");
  if (!el) { el = document.createElement("div"); el.id = "interim"; el.className = "turn interim";
             $("transcript").append(el); }
  el.textContent = text;
  $("transcript").scrollTop = $("transcript").scrollHeight;
}
const clearInterim = () => { $("interim")?.remove(); $("pending")?.remove(); };

/** The agent's reply so far this turn, replaced in place until the turn ends. */
function showPending(text) {
  let el = $("pending");
  if (!el) { el = document.createElement("div"); el.id = "pending"; el.className = "turn interim";
             $("transcript").append(el); }
  el.innerHTML = `<div class="who">Agent</div><div class="t"></div>`;
  el.querySelector(".t").textContent = text;
  $("transcript").scrollTop = $("transcript").scrollHeight;
}

/** The caption, word by word. `append` grows the current line; a bare string
 *  replaces it (that is the gist), and "" clears it at the end of the turn. */
function caption(text, append) {
  const el = $("caption");
  if (!text) { el.textContent = ""; el.classList.remove("over"); return; }
  if (append) el.append(el.childNodes.length ? " " + text : text);
  else el.textContent = text;
}
const agentSpeaking = () => $("state").textContent === "agent speaking";

/** One advisory chip. Capped, because both streams are chatty and neither is worth
 *  scrolling the page for. */
function chip(text, kind) {
  const el = document.createElement("span");
  el.className = `sig${kind ? " " + kind : ""}`;
  el.textContent = text;
  $("meta").append(el);
  while ($("meta").childElementCount > 8) $("meta").firstElementChild.remove();
}

// ── tool activity, with receipts ─────────────────────────────────────────────
const toolEl = (id) => document.getElementById(`tool-${CSS.escape(String(id))}`);

function toolRow(id, name, args) {
  const li = document.createElement("li");
  li.id = `tool-${id}`;
  li.innerHTML = `<div class="name"></div><div class="args"></div><div class="prog"></div>`;
  li.querySelector(".name").textContent = name;
  // Arguments are the model's, so they are text, never markup.
  li.querySelector(".args").textContent = args ? JSON.stringify(args).slice(0, 140) : "";
  $("tools").prepend(li);
}
function toolProgress(id, display) {
  const el = toolEl(id)?.querySelector(".prog");
  if (el && display) el.textContent = display;
}
/** `ok === undefined` means the tool timed out and whether it worked is genuinely
 *  unknown — which is not the same as failing, and is not rendered as failing. */
function toolDone(id, ok, evidence, label) {
  let li = toolEl(id);
  if (!li) { toolRow(id, label ?? String(id), null); li = toolEl(id); }
  li.className = ok === true ? "ok" : ok === false ? "bad" : "";
  const cites = (evidence ?? []).filter(Boolean).slice(0, 5);
  if (!cites.length) return;
  const ul = document.createElement("ul");
  ul.className = "cites";
  for (const c of cites) {
    const item = document.createElement("li");
    const title = c.title || c.document_name || c.document_id || c.url || "source";
    if (c.url) {
      const a = document.createElement("a");
      a.href = c.url; a.target = "_blank"; a.rel = "noreferrer noopener";
      a.textContent = String(title);
      item.append(a);
    } else {
      item.textContent = String(title);
    }
    if (c.quote) { const q = document.createElement("div"); q.className = "args";
                   q.textContent = `“${String(c.quote).slice(0, 160)}”`; item.append(q); }
    ul.append(item);
  }
  li.append(ul);
}
/** The error bar. `code` is the SDK's machine-readable reason — logged rather than
 *  shown, because a candidate needs the sentence and you need the code. */
const note = (m, code) => {
  if (code) console.warn("[whissle]", code, m);
  $("err").textContent = m;
};
</script>
